<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Facebook Login page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="Login">
        <h1>Facebook</h1>
        <form>
            <label>Email:</label>
            <input type="email" >
            <br><br>
            <label>Password:</label>
            <input type="password">
            <br><br>
            <button>Login Button</button>
            <a href="#">Forgot Password</a>
            <br><br>
            <button>Create Account</button>
        </form>
    
    </div>
    
</body>
</html>
